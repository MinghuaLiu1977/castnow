
name: castnow_ios
description: "CastNow - P2P Screen Sharing (iOS)"
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  castnow_core:
    path: ../core
  purchases_flutter: ^10.1.1
  purchases_ui_flutter: ^10.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  mockito: ^5.6.3
  build_runner: ^2.12.2

flutter_launcher_icons:
  ios: true
  image_path: "assets/icon/icon_source_pro.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

dependency_overrides:
  flutter_webrtc: ^0.12.1
